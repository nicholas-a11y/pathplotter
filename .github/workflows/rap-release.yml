name: Publish portable Windows RAP

on:
  push:
    tags: ['rap-v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag beginning rap-v2. (must already exist)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    environment: rap-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Verify release tag
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^rap-v2\.\d+\.\d+$') { throw 'Use a rap-v2.MINOR.PATCH tag.' }
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The requested release tag does not exist.' }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: relay
      - run: npm run check
        working-directory: relay
      - run: npm test
        working-directory: relay
      - name: Verify Windows RAP and GUI
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -File .\rap\Test-RAP.ps1
          if ($LASTEXITCODE -ne 0) { throw 'RAP tests failed.' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -File .\rap\Test-GUI.ps1
          if ($LASTEXITCODE -ne 0) { throw 'GUI tests failed.' }
      - name: Package allowlisted source distribution
        shell: powershell
        run: .\scripts\Package-RAP.ps1 -OutputPath "$env:GITHUB_WORKSPACE\PathPlotter-RAP-Windows.zip"
      - name: Publish downloads
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "PathPlotter Windows RAP $env:RELEASE_TAG" --notes "Portable Windows RAP. Extract the complete ZIP and double-click Start RAP.cmd. Requires the matching protocol 2 relay/frontend. No installer or automatic laser operation."
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $env:RELEASE_TAG .\PathPlotter-RAP-Windows.zip .\PathPlotter-RAP-Windows.zip.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; existing assets are never overwritten automatically.' }
